[package]
name = "fsw-test"
version = "0.1.0"
edition = "2024"


[dependencies]
embedded-hal-mock = { version = "0.11", features = ["eh1", "embedded-hal-async"] }
tokio = { version = "1", features = ["macros", "rt"] }
# Disable hardware-locked features for host-side testing
fsw-lib = { path = "../fsw-lib", default-features = false }
embedded-hal-async = "*"
embedded-hal = "1.0"
embedded-sdmmc = "0.9.0"
