[package]
name = "fsw-lib"
version = "0.1.0"
edition = "2024"

[dependencies]
embedded-hal-async = "1.0"
embedded-hal = "1.0"
# Embassy is optional to allow host-side unit testing of generic drivers
embassy-rp = { version = "0.9.0", optional = true, features = ["defmt", "unstable-pac", "time-driver", "critical-section-impl", "rp235xb", "binary-info"] }
embassy-time = { version = "0.5.0", features = ["defmt", "defmt-timestamp-uptime"] }
defmt = "1.0.1"
chrono = { version = "0.4", default-features = false }
embedded-sdmmc = "0.9.0"

[features]
default = ["hardware"]
hardware = ["dep:embassy-rp"]
